<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Flex Message</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="text-align: center; padding-top: 50px; font-family: sans-serif; background-color: #f4f4f4;">
    
    <div style="background: white; margin: 20px; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2 id="status">กำลังเตรียมระบบ...</h2>
        <p id="message">กรุณารอสักครู่</p>
        <button id="btnShare" style="display: none; padding: 15px 30px; font-size: 18px; background-color: #00b900; color: white; border: none; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold;">
            คลิกที่นี่เพื่อส่งข้อความ
        </button>
    </div>

    <script>
        async function main() {
            try {
                // 1. เริ่มต้น LIFF (ใส่ ID ของคุณเรียบร้อย)
                await liff.init({ liffId: "2008813632-xdaW53x5" });

                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    // ระบบพร้อมทำงาน
                    document.getElementById("status").innerText = "ระบบพร้อมแล้ว!";
                    document.getElementById("message").innerText = "กดปุ่มด้านล่างเพื่อเลือกเพื่อนที่จะส่ง";
                    document.getElementById("btnShare").style.display = "block";

                    // ตั้งค่าเมื่อคลิกปุ่ม
                    document.getElementById("btnShare").onclick = async function() {
                        const result = await liff.shareTargetPicker([
                            {
                                "type": "flex",
                                "altText": "ส่ง Flex Message ให้คุณ",
                                "contents": {
                                    "type": "carousel",
                                    "contents": [
                                        {
                                            "type": "bubble",
                                            "body": {
                                                "type": "box",
                                                "layout": "vertical",
                                                "contents": [
                                                    {
                                                        "type": "image",
                                                        "url": "https://img5.pic.in.th/file/secure-sv1/1-ezgif.com-gif-to-apng-converterb582f030842e9b4c.png",
                                                        "size": "full",
                                                        "animated": true,
                                                        "aspectMode": "cover",
                                                        "aspectRatio": "2.3:3"
                                                    },
                                                    {
                                                        "type": "button",
                                                        "action": {
                                                            "type": "uri",
                                                            "uri": "http://linecorp.com/",
                                                            "label": "    "
                                                        },
                                                        "position": "absolute",
                                                        "offsetTop": "85%",
                                                        "offsetEnd": "18%",
                                                        "offsetStart": "15%"
                                                    }
                                                ],
                                                "paddingAll": "none"
                                            }
                                        },
                                        {
                                            "type": "bubble",
                                            "hero": {
                                                "type": "image",
                                                "url": "https://img2.pic.in.th/2-ezgif.com-gif-to-apng-converter.png",
                                                "size": "full",
                                                "aspectMode": "cover",
                                                "aspectRatio": "2.9:3",
                                                "animated": true
                                            },
                                            "body": {
                                                "type": "box",
                                                "layout": "vertical",
                                                "backgroundColor": "#9370DB",
                                                "contents": [
                                                    {
                                                        "type": "text",
                                                        "text": "The Ride of A Lifetime ",
                                                        "weight": "bold",
                                                        "size": "md",
                                                        "color": "#4A148C",
                                                        "wrap": true
                                                    },
                                                    {
                                                        "type": "text",
                                                        "text": "แนะนำโดย : ",
                                                        "size": "sm",
                                                        "color": "#6A1B9A",
                                                        "wrap": true
                                                    }
                                                ]
                                            }
                                        }
                                    ]
                                }
                            }
                        ]);

                        if (result) {
                            liff.closeWindow(); // ปิดหน้าต่างเมื่อส่งสำเร็จ
                        }
                    }
                }
            } catch (err) {
                document.getElementById("status").innerText = "เกิดข้อผิดพลาด";
                document.getElementById("message").innerText = err;
            }
        }
        main();
    </script>
</body>
</html>
